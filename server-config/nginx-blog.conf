# Hugo 博客 Nginx 配置 — bmg.l2.ink
# 路径：/etc/nginx/sites-available/blog

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name bmg.l2.ink;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name bmg.l2.ink;

    ssl_certificate     /etc/nginx/ssl/_.bmg.l2.ink.pem;
    ssl_certificate_key /etc/nginx/ssl/_.bmg.l2.ink.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /var/www/blog;
    index index.html index.htm;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;
    gzip_min_length 512;

    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location = /index.xml {
        expires 1h;
        add_header Content-Type "application/rss+xml";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
